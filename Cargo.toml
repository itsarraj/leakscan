[package]
name = "leakscan"
version = "0.1.0"
edition = "2021"
description = "A secrets scanner + pre-commit hook — gitleaks/trufflehog without the Go runtime"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/leakscan"
readme = "README.md"
keywords = ["security", "secrets", "git", "pre-commit", "gitleaks"]
categories = ["command-line-utilities"]

[lib]
name = "leakscan"
path = "src/lib.rs"

[[bin]]
name = "leakscan"
path = "src/main.rs"

[dependencies]
regex = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
